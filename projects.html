<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目 | MuSHAN</title>
    <link rel="icon" href="images/favicon.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background-color: #faf9f8;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .site-header {
            background: #fff;
            border-bottom: 1px solid #eaeaea;
            padding: 1.5rem 0;
            position: sticky;
            top: 0;
            backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.9);
            z-index: 100;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .blog-title {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .blog-title a {
            text-decoration: none;
            color: #111;
        }

        .nav-links {
            display: flex;
            gap: 1.8rem;
        }

        .nav-links a {
            text-decoration: none;
            color: #444;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #e67e22;
        }

        /* 页面标题 */
        .page-header {
            margin: 3rem 0 2rem;
        }

        .page-header h1 {
            font-size: 2.2rem;
            border-left: 5px solid #e67e22;
            padding-left: 1rem;
        }

        .page-header p {
            color: #6c757d;
            margin-top: 0.5rem;
            font-size: 1.05rem;
        }

        /* 项目网格 */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-bottom: 3rem;
        }

        .project-card {
            background: #fff;
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid #efefef;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            transition: box-shadow 0.2s, transform 0.1s;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }

        .project-icon {
            font-size: 2rem;
            margin-bottom: 0.8rem;
        }

        .project-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .project-desc {
            color: #4a5568;
            font-size: 0.95rem;
            line-height: 1.5;
            flex: 1;
            margin-bottom: 1rem;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 1rem;
        }

        .tag {
            background: #fdebd0;
            /* 浅橙色背景 */
            color: #e67e22;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .project-links {
            display: flex;
            gap: 1rem;
        }

        .project-links a {
            text-decoration: none;
            color: #e67e22;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .project-links a:hover {
            color: #d35400;
        }

        .site-footer {
            border-top: 1px solid #eaeaea;
            padding: 2rem 0;
            text-align: center;
            color: #6c757d;
            font-size: 0.85rem;
            margin-top: 2rem;
        }

        @media (max-width: 768px) {
            .header-inner {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .project-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="blog-title">
                <a href="index.html">MuSHAN</a>
            </div>
            <nav class="nav-links">
                <a href="index.html">首页</a>
                <a href="projects.html" class="active">项目</a>
                <a href="about.html">关于</a>
                <a href="contact.html">联系</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1>🛠️ 项目</h1>
            <p>这里是我平时实践的一些小作品，记录成长轨迹。</p>
        </div>

        <div class="project-grid">
            <!-- 项目卡片示例 1 -->
            <div class="project-card">
                <div class="project-icon">🌐</div>
                <h3 class="project-title">个人博客</h3>
                <p class="project-desc">基于 HTML/CSS/JS 搭建的静态博客，包含欢迎页、文章列表、关于、联系等页面，后续将集成评论与搜索功能。</p>
                <div class="project-tags">
                    <span class="tag">HTML</span>
                    <span class="tag">CSS</span>
                    <span class="tag">JavaScript</span>
                </div>
                <div class="project-links">
                    <a href="splash.html">🔗 了解更多</a>
                </div>
            </div>

            <div class="project-card">
                <div class="project-icon">🌐</div>
                <h3 class="project-title">深圳高中生社区</h3>
                <p class="project-desc">深圳高中生社区是一个专为深圳地区高中生打造的学习交流与生活分享平台。我们希望通过这个社区，让深圳的高中生们能够互相帮助、分享经验、结识志同道合的朋友，共同度过美好的高中时光。</p>
                <div class="project-tags">
                    <span class="tag">HTML</span>
                    <span class="tag">CSS</span>
                    <span class="tag">JavaScript</span>
                </div>
                <div class="project-links">
                    <a href="splash.html">🔗 了解更多</a>
                </div>
            </div>
            <!-- 如果你有更多项目，可以继续在这里复制卡片结构 -->
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>© 2026 MuSHAN · 简单生活，认真写作</p>
        </div>
    </footer>
</body>

</html>
